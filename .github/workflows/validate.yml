name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate schemas
        run: make schemas

      - name: Validate paper graph
        run: make validate

      - name: Build map
        run: make build

      - name: Export Zotero formats
        run: make export

      - name: Check generated files are committed
        run: git diff --exit-code

      - name: Check whitespace
        run: git diff --check
