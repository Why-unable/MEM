name: validate

on:
  push:
    branches:
      - main
      - "research/**"
      - "data/**"
      - "docs/**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate everything
        run: make check

      - name: Check generated files are committed
        run: git diff --exit-code
